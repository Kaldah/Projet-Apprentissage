# This is the global configuration file for Paper.
# Optimized for Machine Learning environment: minimal overhead, fast ticks, and stability.
# Docs: https://docs.papermc.io/
# Discord: https://discord.gg/papermc
# Website: https://papermc.io/

_version: 28

chunk-loading:
  autoconfig-send-distance: false          # Disable per-player auto tuning
  enable-frustum-priority: true            # Prioritize nearest chunks
  global-max-chunk-load-rate: -1.0         # Unlimited chunk loading (local agents)
  global-max-chunk-send-rate: -1.0         # Unlimited chunk sending
  global-max-concurrent-loads: -1.0        # Unlimited concurrent loads
  max-concurrent-sends: 4                  # Batch send small groups
  min-load-radius: 1                       # Minimize view for speed
  player-max-chunk-load-rate: -1.0         # No per-player load limit
  player-max-concurrent-loads: 20.0        # Reasonable per-player loads
  target-player-chunk-send-rate: 100.0     # High throughput for local connections

chunk-system:
  gen-parallelism: default                 # Use CPU cores count
  io-threads: 4                            # Async disk I/O threads
  worker-threads: 8                        # Network & packet worker threads

collisions:
  enable-player-collisions: false         # Disable player collisions
  send-full-pos-for-hard-colliding-entities: true

commands:
  fix-target-selector-tag-completion: true
  suggest-player-names-when-null-tab-completions: true
  time-command-affects-all-worlds: false

console:
  enable-brigadier-completions: true
  enable-brigadier-highlighting: true
  has-all-permissions: false

item-validation:
  book:
    author: 8192
    page: 16384
    title: 8192
  book-size:
    page-max: 2560
    total-multiplier: 0.98
  display-name: 8192
  lore-line: 8192
  resolve-selectors-in-books: false

logging:
  deobfuscate-stacktraces: false           # Disable heavy logging features
  log-player-ip-addresses: false           # Skip IP logging
  use-rgb-for-named-text-colors: false     # Simpler text coloring

messages:
  kick:
    authentication-servers-down: <lang:multiplayer.disconnect.authservers_down>
    connection-throttle: Connection throttled! Please wait before reconnecting.
    flying-player: <lang:multiplayer.disconnect.flying>
    flying-vehicle: <lang:multiplayer.disconnect.flying>
  no-permission: <red>I'm sorry, but you do not have permission to perform this command.
    Please contact the server administrators if you believe that this is in error.
  use-display-name-in-quit-message: false

misc:
  chat-threads:
    chat-executor-core-size: -1
    chat-executor-max-size: -1
  fix-entity-position-desync: true
  lag-compensate-block-breaking: true
  load-permissions-yml-before-plugins: true
  max-joins-per-tick: 5                    # Limit join bursts
  region-file-cache-size: 256               # Cached region files
  strict-advancement-dimension-check: false
  use-alternative-luck-formula: false
  use-dimension-type-for-custom-spawners: false

packet-limiter:
  all-packets:
    action: IGNORE                          # Disable packet limiting
    interval: 0.0
    max-packet-rate: -1.0
  kick-message: <red><lang:disconnect.exceeded_packet_rate>
  overrides: {}

player-auto-save:
  max-per-tick: -1                          # Disable auto-saving per tick
  rate: -1                                 # Disable periodic saves

proxies:
  bungee-cord:
    online-mode: true
  proxy-protocol: false
  velocity:
    enabled: false
    online-mode: false
    secret: ''

scoreboards:
  save-empty-scoreboard-teams: false
  track-plugin-scoreboards: false

spam-limiter:
  incoming-packet-threshold: 300
  recipe-spam-increment: 1
  recipe-spam-limit: 20
  tab-spam-increment: 1
  tab-spam-limit: 500

timings:
  enabled: false                           # Disable detailed timings
  hidden-config-entries:
    - database
    - proxies.velocity.secret
  history-interval: 300
  history-length: 3600
  server-name: "ML-Server"
  server-name-privacy: false
  url: https://timings.aikar.co/
  verbose: false

unsupported-settings:
  allow-grindstone-overstacking: false
  allow-headless-pistons: false
  allow-permanent-block-break-exploits: false
  allow-piston-duplication: false
  perform-username-validation: false      # Speed up logins

watchdog:
  early-warning-delay: 10000
  early-warning-every: 5000
